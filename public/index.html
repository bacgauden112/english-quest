<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Quest — Tự học tiếng Anh</title>
<meta name="theme-color" content="#7C5CFF">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --bg:#F4F2FF; --card:#FFFFFF; --ink:#1F1B3A; --muted:#6E6A8A; --line:#E6E2F7;
  --violet:#7C5CFF; --violet-d:#5A3EE0; --green:#22C55E; --green-d:#16A34A;
  --gold:#FFB020; --gold-d:#E08E00; --flame:#FF6B2C; --red:#F43F5E; --red-d:#D61F45;
  --sky:#2DB7F5; --sky-d:#1494D1; --grey:#D9D6EA; --grey-d:#B9B5D0;
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700}
button,input,select,textarea{font-family:inherit;font-weight:700;color:inherit}
a{color:var(--violet-d)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 110px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(244,242,255,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:900;font-size:18px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .logo{width:34px;height:34px}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px;padding:6px 10px;border-radius:999px;background:var(--card);border:2px solid var(--line)}
.stat.flame{color:var(--flame)} .stat.xp{color:var(--violet-d)}
.stat.off{filter:grayscale(1);opacity:.6}
.ring{width:38px;height:38px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--green-d)}
.iconbtn{background:none;border:none;cursor:pointer;padding:6px;border-radius:12px;color:var(--muted)}
.iconbtn:hover{background:var(--line)}
.save{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 0}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:2px solid var(--line)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 12px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:800;border-top:3px solid transparent}
.nav a svg{width:26px;height:26px}
.nav a.on{color:var(--violet-d);border-top-color:var(--violet)}
/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.card h2{margin:0 0 6px;font-size:20px;font-weight:900}
.card h3{margin:0 0 6px;font-size:17px;font-weight:900}
.muted{color:var(--muted);font-weight:700}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
/* chunky buttons */
.btn{--c:var(--violet);--d:var(--violet-d);border:none;cursor:pointer;background:var(--c);color:#fff;font-weight:900;font-size:16px;letter-spacing:.3px;text-transform:uppercase;padding:13px 20px;border-radius:16px;box-shadow:0 5px 0 var(--d);transform:translateY(0);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.btn:disabled{--c:var(--grey);--d:var(--grey-d);cursor:not-allowed;color:#fff}
.btn.green{--c:var(--green);--d:var(--green-d)} .btn.gold{--c:var(--gold);--d:var(--gold-d)}
.btn.red{--c:var(--red);--d:var(--red-d)} .btn.sky{--c:var(--sky);--d:var(--sky-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.sm{font-size:13px;padding:9px 14px;border-radius:13px;box-shadow:0 4px 0 var(--d)}
.btn.ghost.sm{box-shadow:0 3px 0 var(--line)}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:800}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.chip.ngw{font-size:15px;padding:9px 14px;background:#E8FBEF;border-color:#BDF0CF}
.chip.ngw.unk{background:#FFECEF;border-color:var(--red);color:#A3122F;text-decoration:none}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:14px;background:#FBFAFF;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--violet)}
textarea{min-height:90px;resize:vertical;font-weight:600;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
/* hero */
.hero{background:linear-gradient(135deg,#7C5CFF,#9B7BFF 55%,#2DB7F5);color:#fff;border:none;position:relative;overflow:hidden}
.hero .wk{font-size:13px;opacity:.9;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.hero h2{font-size:22px;margin:4px 0 8px}
.hero .topic{display:inline-block;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:999px;font-size:14px}
.hero .bot{position:absolute;right:6px;top:6px;width:78px;opacity:.95}
.hero h2,.hero .wk{padding-right:76px}
.lvl{display:flex;align-items:center;gap:10px;margin-top:14px}
.lvl .bar{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s}
.lvl b{font-size:13px}
/* path */
.path{position:relative;padding:10px 0 4px}
.node{display:flex;align-items:center;gap:16px;margin:0 0 18px;position:relative}
.node:nth-child(even){flex-direction:row-reverse;text-align:right}
.bubble{width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;cursor:pointer;border:none;background:var(--grey);box-shadow:0 7px 0 var(--grey-d);transition:transform .08s;position:relative}
.bubble svg{width:36px;height:36px;color:#fff}
.bubble:active{transform:translateY(5px);box-shadow:0 2px 0 var(--grey-d)}
.node.next .bubble{background:var(--violet);box-shadow:0 7px 0 var(--violet-d);animation:bob 1.6s ease-in-out infinite}
.node.done .bubble{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.next .bubble::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid rgba(124,92,255,.35);animation:pulse 1.6s ease-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.ninfo{flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer}
.ninfo .t{font-weight:900;font-size:16px}
.ninfo .s{font-size:13px;color:var(--muted);margin-top:2px}
.ninfo .x{font-size:12px;color:var(--violet-d);font-weight:900;margin-top:4px}
.node.done .ninfo .x{color:var(--gold-d)}
.start-tag{position:absolute;top:-26px;left:6px;background:var(--card);border:2px solid var(--violet);color:var(--violet-d);font-size:12px;font-weight:900;padding:3px 9px;border-radius:10px;animation:bob 1.6s ease-in-out infinite;white-space:nowrap;z-index:2}
.node:nth-child(even) .start-tag{left:auto;right:6px}
.chest{text-align:center;padding:8px 0 4px}
.chest svg{width:96px;height:96px;cursor:pointer}
.chest.locked svg{filter:grayscale(1);opacity:.5;cursor:default}
.chest.open svg{animation:wiggle .8s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;padding:9px;border-radius:11px;cursor:pointer;font-weight:900;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}
/* review */
.pbar{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.flash .sent{font-size:22px;line-height:1.45;font-weight:800}
.flash .sent b{color:var(--violet-d);background:#EFEAFF;padding:0 5px;border-radius:7px}
.flash .ans{border-top:2px dashed var(--line);padding-top:14px}
.flash .w{font-size:26px;font-weight:900}
.flash .m{font-size:17px;color:var(--muted);margin-top:4px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:2px;padding:10px 4px;font-size:14px}
.grades .btn small{font-size:11px;opacity:.9;text-transform:none;font-weight:800}
.combo{display:inline-block;background:var(--flame);color:#fff;padding:4px 12px;border-radius:999px;font-weight:900;font-size:14px;animation:pop .3s}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.speak{width:52px;height:52px;border-radius:50%;border:none;background:var(--sky);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--sky-d);display:inline-grid;place-items:center}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-d)}
.speak svg{width:24px;height:24px}
.speak.slow{background:#8FD8FA;box-shadow:0 4px 0 #5CBDE8}
.mic{width:76px;height:76px;border-radius:50%;border:none;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 6px 0 var(--red-d);display:inline-grid;place-items:center}
.mic svg{width:34px;height:34px}
.mic.on{animation:pulseR 1s infinite}
@keyframes pulseR{0%{box-shadow:0 6px 0 var(--red-d),0 0 0 0 rgba(244,63,94,.5)}100%{box-shadow:0 6px 0 var(--red-d),0 0 0 22px rgba(244,63,94,0)}}
/* listening */
.line{padding:9px 12px;border-radius:12px;margin:4px 0;cursor:pointer;line-height:1.5;font-weight:700}
.line:hover{background:#F4F1FF}
.line.on{background:#EFEAFF;outline:2px solid var(--violet)}
.line .sp{font-size:12px;font-weight:900;color:var(--violet-d);margin-right:6px}
.blur{filter:blur(6px);user-select:none}
.q{margin:14px 0}
.q .opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:6px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--line)}
.q .opt.pick{border-color:var(--violet);background:#F1EDFF}
.q .opt.ok{border-color:var(--green);background:#E8FBEF}
.q .opt.bad{border-color:var(--red);background:#FFECEF}
.dots{display:inline-flex;gap:5px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--grey);display:inline-block;cursor:pointer}
.dots i.on{background:var(--green)}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.li:last-child{border-bottom:none}
video{width:100%;border-radius:14px;background:#000;max-height:320px}
/* shadow */
.target{font-size:21px;line-height:1.6;font-weight:800;text-align:center}
.target .ok{color:var(--green-d)} .target .miss{color:var(--red);text-decoration:underline wavy}
.heard{min-height:28px;text-align:center;color:var(--muted);font-size:16px}
.score{font-size:44px;font-weight:900;text-align:center}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px}
.msg{max-width:85%;padding:11px 14px;border-radius:18px;line-height:1.45;font-weight:700}
.msg.ai{background:#F1EDFF;align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{background:var(--violet);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.fix{align-self:flex-end;max-width:85%;background:#FFF7E6;border:2px solid #FFE1A6;border-radius:14px;padding:9px 12px;font-size:14px}
.fix b{color:var(--gold-d)}
/* progress */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.tile .n{font-size:24px;font-weight:900}
.tile .l{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line);display:block}
.heat i.l1{background:#D7CCFF}.heat i.l2{background:#A994FF}.heat i.l3{background:#7C5CFF}.heat i.l4{background:#4F2FD6}
.heat i.today{outline:2px solid var(--gold)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{text-align:center;font-size:12px}
.badge .b{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,#FFD15C,#FFB020);box-shadow:0 5px 0 var(--gold-d)}
.badge.lock .b{background:var(--line);box-shadow:0 5px 0 var(--grey);filter:grayscale(1);opacity:.55}
.badge .nm{font-weight:900}
.wkrow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:2px solid var(--line)}
.wkrow:last-child{border-bottom:none}
.wkno{width:38px;height:38px;border-radius:12px;background:var(--line);display:grid;place-items:center;font-weight:900;flex:none}
.wkrow.cur .wkno{background:var(--violet);color:#fff}
.wkrow.done .wkno{background:var(--gold);color:#fff}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(31,27,58,.55);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:26px;padding:24px;max-width:420px;width:100%;text-align:center;animation:pop .35s;max-height:90vh;overflow:auto}
.modal h2{font-size:24px;font-weight:900;margin:8px 0}
.modal .big{font-size:64px;line-height:1}
.modal .xpgain{display:inline-block;background:#F1EDFF;color:var(--violet-d);font-weight:900;padding:8px 16px;border-radius:999px;font-size:18px;margin:6px 0 16px}
.modal.left{text-align:left}
.float{position:fixed;z-index:60;font-weight:900;color:var(--violet-d);font-size:20px;pointer-events:none;animation:floatUp 1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes floatUp{to{transform:translateY(-50px);opacity:0}}
.toast{pointer-events:none;position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;animation:pop .3s;max-width:90vw}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.hide{display:none!important}
.tabs2{display:flex;gap:8px;margin:14px 0 0;overflow:auto}
.note{background:#FFF7E6;border:2px solid #FFE1A6;border-radius:14px;padding:10px 12px;font-size:14px}
.err{background:#FFECEF;border:2px solid #FFC2CD;border-radius:14px;padding:10px 12px;font-size:14px;color:#A3122F}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:480px){
  .grid4{grid-template-columns:repeat(2,1fr)} .badges{grid-template-columns:repeat(3,1fr)}
  .brand span{display:none} .flash .sent{font-size:19px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><svg class="logo" viewBox="0 0 64 64"><rect x="6" y="10" width="52" height="44" rx="16" fill="#7C5CFF"/><rect x="6" y="10" width="52" height="38" rx="16" fill="#9B7BFF"/><circle cx="24" cy="29" r="6" fill="#fff"/><circle cx="40" cy="29" r="6" fill="#fff"/><circle cx="25" cy="30" r="3" fill="#1F1B3A"/><circle cx="41" cy="30" r="3" fill="#1F1B3A"/><path d="M26 39q6 5 12 0" stroke="#1F1B3A" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="29" y="2" width="6" height="10" rx="3" fill="#FFB020"/></svg><span>English Quest</span></div>
    <div class="stat flame" id="hStreak" title="Chuỗi ngày học">🔥 <b>0</b></div>

    <div class="ring" id="hRing" title="Mục tiêu XP hôm nay"></div>

  </div>
  <div class="save" id="saveState"></div>
</header>
<main class="wrap" id="view"></main>
<nav class="nav"><div class="nav-in" id="nav"></div></nav>

<script>
"use strict";

function makeDict(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;
  let rec=null;const h={p:()=>{},f:()=>{},s:()=>{}};
  return{
    onPartial(fn){h.p=fn},onFinal(fn){h.f=fn},onState(fn){h.s=fn},
    start(){return new Promise((res,rej)=>{try{
      rec=new R();rec.lang="en-US";rec.interimResults=true;rec.continuous=true;
      rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)h.f({text:r[0].transcript.trim()});else interim+=r[0].transcript}h.p({text:interim.trim()})};
      rec.onstart=()=>{h.s({state:"listening"});res()};
      rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")rej({code:"not_granted"})};
      rec.onend=()=>h.s({state:"idle",reason:"stopped"});
      rec.start()}catch(err){rej(err)}})},
    stop(){return new Promise(res=>{if(!rec)return res();const old=rec.onend;rec.onend=()=>{old&&old();res()};try{rec.stop()}catch(e){res()}})}
  };
}

}

/* ================= DERIVED ================= */
const IT_CARDS=CARDS_RAW.map((c,i)=>({id:"b"+i,word:c[0],sentence:c[1],meaning:c[2],tags:(c[3]||"").split(/\s+/).filter(Boolean)}));
const NG_CARDS=NGSL_RAW.map((w,i)=>({id:"n"+(i+1),rank:i+1,word:w,tags:["ngsl"],ng:true,sentence:"",meaning:""}));
let NG={};
const mdBold=h=>h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function applyNG(){for(const r in NG){const c=NG_CARDS[r-1];if(c&&NG[r]){c.sentence=mdBold(esc(NG[r][0]));c.meaning=NG[r][1]}}}
function customCards(){return S.custom.map(c=>({...c,sentence:boldWord(esc(c.sentence),c.word)}))}
function allCards(){return IT_CARDS.concat(customCards(),NG_CARDS)}
const isKnown=r=>S.ngKnown.charCodeAt(r-1)===49;
function setKnown(r,v){let s=S.ngKnown;if(s.length<NGSL_RAW.length)s=s.padEnd(NGSL_RAW.length,"0");S.ngKnown=s.slice(0,r-1)+(v?"1":"0")+s.slice(r)}
function ngKnownCount(){let n=0;for(let i=0;i<S.ngKnown.length;i++)if(S.ngKnown.charCodeAt(i)===49)n++;return n}
function ngCount(){return ngKnownCount()+NG_CARDS.filter(c=>!isKnown(c.rank)&&S.cards[c.id]&&S.cards[c.id].reps>0).length}
function ngRatio(){if(S.ngRatio!=null)return S.ngRatio;let b={A:.9,B:.7,C:.3}[S.level]??.7;if(curWeek()>=5)b-=.2;return Math.max(0,Math.min(1,b))}
const sentOf=c=>c.sentence||("<b>"+esc(c.word)+"</b>");
function boldWord(html,word){if(!word)return html;const w=esc(word).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");const re=new RegExp("("+w+")","i");return re.test(html)?html.replace(re,"<b>$1</b>"):html}
const learnedCount=()=>Object.values(S.cards).filter(c=>c.reps>0||c.ivl>0).length;
function curWeek(){if(!S.startDate)return 0;return Math.floor(diffDays(S.startDate,today())/7)+1}
function phaseOf(w){if(w<1)w=1;return PHASES[Math.floor(((w-1)%12)/2)]}
function steps(){return S.busy?STEPS_BUSY:STEPS_FULL}
function totalSteps(){return Object.values(S.days).reduce((a,d)=>a+Object.keys(d.t||{}).length,0)}
function activeDay(d){const x=S.days[d];return !!(x&&x.t&&Object.keys(x.t).length)}
function streak(){let d=today(),n=0;if(!activeDay(d))d=addDays(d,-1);while(activeDay(d)){n++;d=addDays(d,-1)}return n}
function level(xp){let l=1,need=100,acc=0;while(xp>=acc+need){acc+=need;l++;need=100+ (l-1)*50}return{l,cur:xp-acc,need}}
const goalXP=()=>S.busy?60:120;
function dueCards(){const t=today();return allCards().filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t)}
function newLeft(){return Math.max(0,S.newPerDay-day().newDone)}
function newPool(){
  const focus=phaseOf(curWeek()).tags;
  const fresh=IT_CARDS.concat(customCards()).filter(c=>!S.cards[c.id]);
  const it=fresh.filter(c=>c.tags.some(t=>focus.includes(t))).concat(fresh.filter(c=>!c.tags.some(t=>focus.includes(t))));
  const ng=NG_CARDS.filter(c=>!S.cards[c.id]&&!isKnown(c.rank));
  const ratio=ngRatio();const out=[];let a=0,i=0,j=0;
  while(i<it.length||j<ng.length){a+=ratio;if((a>=1&&j<ng.length)||i>=it.length){out.push(ng[j++]);a-=1}else out.push(it[i++]);if(out.length>=200)break}
  return out;
}

/* ================= SOUND / FX ================= */
let AC=null;
function tone(seq){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.75})}catch(e){}}
const SFX={
  ok:()=>tone([[880,.09],[1320,.14]]),
  soft:()=>tone([[520,.1,"triangle"]]),
  bad:()=>tone([[300,.14,"triangle"],[240,.18,"triangle"]]),
  step:()=>tone([[523,.1],[659,.1],[784,.1],[1047,.22]]),
  big:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.12],[784,.1],[1047,.35,"triangle"]]),
  combo:()=>tone([[988,.07],[1319,.07],[1760,.16]])
};
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],raf=null;
function confetti(n=140){
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#7C5CFF","#FFB020","#22C55E","#2DB7F5","#FF6B2C","#F43F5E"];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*8+5,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0});
  if(!raf)loop();
}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()});parts=parts.filter(p=>p.y<cv.height+40&&p.life<260);raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),null)}
function floatXP(n,el){const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0};const f=document.createElement("div");f.className="float";f.textContent="+"+n+" XP";f.style.left=(r.left+r.width/2-30)+"px";f.style.top=(r.top-10)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
function toast(msg,ms=2200){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function modal(html,cls=""){closeModal();const o=document.createElement("div");o.className="ov";o.id="ov";o.innerHTML='<div class="modal '+cls+'">'+html+'</div>';o.addEventListener("click",e=>{if(e.target===o&&!o.dataset.lock)closeModal()});document.body.appendChild(o);return o}
function closeModal(){const o=$("#ov");if(o)o.remove()}

function addXP(n,el){

function checkBadges(){
  const st=streak();if(st>S.bestStreak)S.bestStreak=st;
  const fresh=[];BADGES.forEach(b=>{if(!S.badges[b[0]]&&b[4](S)){S.badges[b[0]]=today();fresh.push(b)}});

function completeStep(key){
  const d=day();if(d.t[key])return;
  d.t[key]=1;

  addXP(20,false);SFX.step();confetti(110);

let dictTarget=null,dictOn=false,dictBuf="",dictPartial="";
function dictBus(kind,text,reason){
  if(kind==="state"){dictOn=text==="listening";updateMicUI();if(!dictOn&&dictTarget)dictDone();return}
  if(kind==="partial"){dictPartial=text}
  if(kind==="final"){dictBuf=(dictBuf+" "+text).trim();dictPartial=""}

  stopSpeak();dictTarget=target;dictBuf="";dictPartial="";

/* ================= NGSL CONTENT (AI) ================= */
async function ensureContent(list){
  const miss=list.filter(c=>c.ng&&!NG[c.rank]);
  if(!miss.length||!CAP.sample)return;
  for(let i=0;i<miss.length;i+=15){
    const batch=miss.slice(i,i+15);
    const prompt="For each English word below, write ONE natural example sentence for a Vietnamese software developer learning English. Level: "+LEVELS[S.level]+". Prefer workplace, technology or daily-life situations that fit the word's MOST COMMON meaning. Keep sentences under 16 words. Wrap the target word, in whatever form it appears in the sentence, in double asterisks, for example **went**. Also give a short Vietnamese meaning for that most common sense, starting with the part of speech in brackets, e.g. \"(đgt) đi\", \"(dt) công ty\", \"(tt) quan trọng\".\nWords: "+batch.map(c=>c.word).join(", ")+"\nReturn ONLY a JSON object: {\"items\":[{\"w\":\"word\",\"s\":\"sentence\",\"m\":\"Vietnamese meaning\"}]}";
    try{const r=await CAP.sample(prompt,{modelTier:"quick"});const j=parseJSON(r.text);const got=[];
      (j.items||[]).forEach(it=>{const c=batch.find(b=>b.word.toLowerCase()===String(it.w||"").toLowerCase());if(c&&it.s&&it.m){NG[c.rank]=[String(it.s).slice(0,240),String(it.m).slice(0,120)];got.push(c.rank)}});
      applyNG();saveNG(got);
    }catch(e){if(e&&e.code==="not_granted")return}
  }
}

function buildQueue(){const due=dueCards().sort((a,b)=>S.cards[a.id].due<S.cards[b.id].due?-1:1);const nw=newPool().slice(0,newLeft());const q=[];let i=0,j=0;while(i<due.length||j<nw.length){if(i<due.length)q.push(due[i++]);if(i<due.length)q.push(due[i++]);if(j<nw.length)q.push(nw[j++])}return q}
function sched(st,g){
  st=Object.assign({ivl:0,ease:2.5,reps:0,lapses:0},st||{});
  if(g===0){if(st.reps>0)st.lapses++;st.reps=0;st.ivl=0;st.ease=Math.max(1.3,st.ease-.2);st.due=today();return st}
  if(g===1){st.ivl=st.reps===0?1:Math.max(1,Math.round(st.ivl*1.2));st.ease=Math.max(1.3,st.ease-.15)}
  if(g===2){st.ivl=st.reps===0?1:st.reps===1?3:Math.round(Math.max(st.ivl,1)*st.ease)}
  if(g===3){st.ivl=st.reps===0?3:Math.round(Math.max(st.ivl,1)*st.ease*1.3);st.ease+=.15}
  st.reps++;st.due=addDays(today(),st.ivl);return st;
}

function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean)}
function shadowCheck(said){
  const target=SP.list[SP.i%SP.list.length];const tw=target.split(/\s+/);const tn=tw.map(w=>norm(w)[0]||"");const sn=norm(said);
  const m=tn.length,n=sn.length;const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=tn[i]&&tn[i]===sn[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(tn[i]&&tn[i]===sn[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const valid=tn.filter(Boolean).length||1;const score=Math.round(hit.filter((h,k)=>h&&tn[k]).length/valid*100);
  SP.result={score,html:tw.map((w,k)=>'<span class="'+(hit[k]||!tn[k]?"ok":"miss")+'">'+esc(w)+'</span>').join(" ")};
  const d=day();d.shadowN=(d.shadowN||0)+1;S.stats.shadows++;
  if(score>=80)SFX.ok();else SFX.soft();
  render();addXP(score>=80?5:2,$("#shTarget"));
  if(d.shadowN>=5&&!d.t.shadow)setTimeout(()=>completeStep("shadow"),700);else checkBadges();
}

    shsay:()=>speak(SP.list[SP.i%SP.list.length]),
    shslow:()=>speak(SP.list[SP.i%SP.list.length],{rate:.75}),
    shmic:()=>micStart("shadow"),
    shcheck:()=>{const v=$("#shType").value.trim();if(v)shadowCheck(v)},
    shnext:()=>{SP.i++;SP.result=null;render()},
    shprev:()=>{SP.i=Math.max(0,SP.i-1);SP.result=null;render()},
    tkscen:()=>{S.talkScen=el.dataset.k;TK.i=0;save();render()},
    tksay:()=>{const sc=S.talkScen||phaseOf(curWeek()).scen;speak(PROMPTS[sc][TK.i%PROMPTS[sc].length])},
    tkslow:()=>{const sc=S.talkScen||phaseOf(curWeek()).scen;speak(PROMPTS[sc][TK.i%PROMPTS[sc].length],{rate:.75})},
    tkmic:()=>micStart("talk"),
    tkskip:()=>{TK.i++;render()},
    tkstarter:()=>speak(el.dataset.s),
    tkdone:()=>{const v=($("#talkIn")&&$("#talkIn").value||"").trim();const w=v.split(/\s+/).filter(Boolean).length;if(w<3){toast("Nói (hoặc gõ) ít nhất một câu trước nhé");return}
      const d=day();d.talkN=(d.talkN||0)+1;TK.i++;SFX.ok();render();addXP(w>=25?6:w>=8?4:2,$(".target"));toast(w+" từ · "+(w>=25?"Rất tốt!":w>=8?"Ổn — lần sau thử nói dài hơn":"Hơi ngắn, thử nói 3–5 câu nhé"));
      if(d.talkN>=4&&!d.t.speak){S.stats.convos++;setTimeout(()=>completeStep("speak"),800)}else checkBadges()},
    ngnote:()=>{const r=Number(el.dataset.r);const v=($("#ngNote").value||"").trim();if(v)S.ngNotes[r]=v.slice(0,120);else delete S.ngNotes[r];applyNotes();save();toast("Đã lưu nghĩa");render()},
    stsave:()=>{S.startDate=$("#stDate").value||S.startDate;S.level=$("#stLevel").value;S.newPerDay=Math.max(0,Math.min(50,Number($("#stNew").value)||10));S.rate=Number($("#stRate").value)||1;const v=$("#stVoice");if(v)S.voice=v.value;S.sound=$("#stSound").checked;const np=$("#stPass").value.trim();let op="";try{op=localStorage.getItem("eq-pass")||"";localStorage.setItem("eq-pass",np)}catch(e){}save();closeModal();render();toast("Đã lưu cài đặt");if(np!==op)connectRemote()},
    backup:()=>{navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("Đã sao chép bản sao lưu")).catch(()=>toast("Trình duyệt chặn sao chép"))},
    restore:()=>{const v=($("#stRestore")&&$("#stRestore").value||"").trim();if(!v)return;try{const o=JSON.parse(v);if(!o||typeof o!=="object"||!o.days)throw 0;S=Object.assign(defState(),o);S.updatedAt=Date.now();applyNotes();save();closeModal();render();toast("Đã khôi phục bản sao lưu")}catch(e){toast("Bản sao lưu không hợp lệ")}}
  };
  if(H[a])H[a]();
});
document.addEventListener("keydown",e=>{
  if(route()==="cards"&&RV&&RV.q[RV.i]&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
    if(e.key===" "&&!RV.show){e.preventDefault();RV.show=true;render()}
    else if(RV.show&&["1","2","3","4"].includes(e.key)){const b=document.querySelector('[data-act="grade"][data-g="'+(Number(e.key)-1)+'"]');if(b)b.click()}
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="bq"){CV.q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#bq");n.focus();n.setSelectionRange(pos,pos)}
  if(e.target.id==="trans"){S.transcript=e.target.value.slice(0,20000);SP.list=null;clearTimeout(window._mt);window._mt=setTimeout(save,1500)}
});
document.addEventListener("change",e=>{
  if(e.target.id==="lrate"){S.rate=Number(e.target.value);save()}
  if(e.target.id==="mrate"&&mediaEl){mediaEl.playbackRate=Number(e.target.value)}
  if(e.target.id==="mfile"){const f=e.target.files&&e.target.files[0];if(!f)return;if(!mediaEl){mediaEl=document.createElement("video");mediaEl.controls=true;mediaEl.playsInline=true;mediaEl.addEventListener("timeupdate",()=>{if(mediaLoop&&mediaB!=null&&mediaEl.currentTime>=mediaB)mediaEl.currentTime=mediaA})}if(mediaEl.src)URL.revokeObjectURL(mediaEl.src);mediaEl.src=URL.createObjectURL(f);mediaA=mediaB=null;mediaLoop=false;mountMedia();const ab=$("#abinfo");if(ab)ab.textContent=abInfo()}
});

/* ================= BOOT ================= */
applyNotes();
render();
initCaps();
</script>
</body>
</html>
